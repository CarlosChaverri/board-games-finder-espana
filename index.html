<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Board Games & Craft Beer Finder España — Bares de juegos de mesa y cervecerías de especialidad</title>
<meta name="description" content="Mapas de bares de juegos de mesa y cervecerías de especialidad en toda España: compara valoraciones, reseñas, grifos y catálogos de juegos y cervezas, y encuentra tu próximo local.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#fafaf9; --panel:#ffffff; --ink:#1c1917; --muted:#78716c; --faint:#a8a29e;
  --accent:#c2410c; --line:#e7e5e4; --chip:#f5f5f4; --star:#d97706;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;color:var(--ink);background:var(--bg)}
body{display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
/* ---------- Header ---------- */
header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;z-index:1200;position:relative}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:max-content}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--muted)}
.game-search{position:relative;flex:1;min-width:220px;max-width:520px}
.game-search input{width:100%;padding:9px 34px 9px 13px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;outline:none;transition:border-color .15s}
.game-search input::placeholder{color:var(--faint)}
.game-search input:focus{border-color:var(--ink)}
.gs-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--faint);font-size:15px;display:none}
.gs-clear:hover{color:var(--ink)}
.gs-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.08);max-height:340px;overflow:auto;display:none;z-index:1300}
.gs-item{padding:9px 12px;border-bottom:1px solid var(--chip);cursor:pointer}
.gs-item:last-child{border-bottom:0}
.gs-item:hover{background:var(--bg)}
.gs-item .nm{font-size:13.5px;font-weight:600}
.gs-item .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gs-family{padding:7px 12px 3px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);background:#fff;position:sticky;top:0}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px;white-space:nowrap}
.badge.ok{background:#ecfdf5;color:#047857}
.badge.est{background:var(--chip);color:var(--muted)}
.badge.mid{background:#eff6ff;color:#1d4ed8}
.badge.warn{background:#fffbeb;color:#b45309}
.hdr-actions{display:flex;gap:8px;margin-left:auto}
.hdr-btn{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.hdr-btn:hover{border-color:var(--ink)}
/* ---------- Game banner ---------- */
#gameBanner{display:none;background:var(--panel);border-bottom:1px solid var(--line);color:var(--ink);padding:8px 18px;font-size:13px;align-items:center;gap:8px;z-index:1100;position:relative}
#gameBanner.show{display:flex}
#gameBanner .pill{background:var(--chip);border:1px solid var(--line);padding:2px 10px;border-radius:20px;font-weight:600}
#gameBanner #bannerNote{color:var(--muted)}
#gameBanner button{margin-left:auto;background:none;border:0;color:var(--accent);font-size:13px;font-weight:600;padding:2px 4px}
/* ---------- Layout ---------- */
main{flex:1;display:flex;min-height:0;position:relative}
#sidebar{width:372px;min-width:372px;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid var(--line);z-index:1000;min-height:0}
#map{flex:1;background:#e7e5e4}
/* ---------- Filters ---------- */
#filters{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.f-row{margin-bottom:12px}
.f-row:last-child{margin-bottom:0}
.f-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.f-label output{color:var(--ink);font-size:12px;font-weight:700}
#nameSearch{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;outline:none;background:var(--bg)}
#nameSearch:focus{border-color:var(--ink);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px;padding:5px 11px;border-radius:20px;transition:all .12s}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
input[type=range]{width:100%;accent-color:var(--ink)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--ink)}
/* ---------- Results ---------- */
#resultsBar{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#count{font-size:12px;color:var(--muted);font-weight:600}
#results{flex:1;overflow-y:auto}
.card{padding:13px 16px;border-bottom:1px solid var(--chip);cursor:pointer;transition:background .1s}
.card:hover{background:var(--bg)}
.card.active{background:#fff7ed;border-left:3px solid var(--accent);padding-left:13px}
.card h3{font-size:14px;font-weight:650;margin-bottom:2px}
.card .where{font-size:11.5px;color:var(--faint);margin-bottom:4px}
.card .sub{font-size:12.5px;color:var(--muted)}
.stars{color:var(--star);font-weight:700}
.reviews{color:var(--muted);font-weight:400;font-size:12px}
.score-flag{font-size:10.5px;color:var(--faint)}
/* ---------- Markers ---------- */
.pin{display:flex;align-items:center;justify-content:center;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.3);background:var(--ink);color:#fff;font-weight:700}
.pin span{transform:rotate(45deg);font-size:11.5px}
.pin.irish{background:#169b62}
/* ---------- Popup ---------- */
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.14)}
.leaflet-popup-content{margin:15px 17px;font-family:inherit;min-width:240px;max-width:300px;line-height:1.45}
.pop h3{font-size:15.5px;margin-bottom:2px;letter-spacing:-.01em}
.pop .tipo-zona{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:8px}
.pop .dir{font-size:12.5px;color:var(--muted);margin-bottom:9px}
.pop .row{display:flex;gap:8px;align-items:baseline;font-size:13px;margin-bottom:5px}
.pop .row b{min-width:78px;color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.pop .btns{display:flex;gap:7px;margin-top:12px}
.pop .btns a{flex:1;text-align:center;text-decoration:none;font-size:12.5px;font-weight:600;padding:8px 0;border-radius:8px}
.btn-maps{background:var(--ink);color:#fff}
.btn-web{background:#fff;color:var(--ink);border:1px solid var(--line)}
.nodata{color:var(--faint);font-style:italic}
/* ---------- View switch ---------- */
.view-switch{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.vs-btn{border:0;background:#fff;padding:8px 14px;font-size:13px;color:var(--muted);transition:all .12s}
.vs-btn:hover{color:var(--ink)}
.vs-btn.on{background:var(--ink);color:#fff;font-weight:600}
/* ---------- Mobile: un solo scroll ---------- */
@media (max-width:900px){
  body{display:block;overflow:auto}
  main{display:block;min-height:0}
  #map{position:relative;width:100%;height:52vh;min-height:340px}
  #sidebar{position:static;width:auto;min-width:0;border-right:0}
  #results{overflow:visible}
  header{padding:10px 12px;gap:8px}
  .brand span{display:none}
  .view-switch{width:100%;order:3}
  .vs-btn{flex:1;text-align:center;padding:8px 6px}
  .hdr-actions{margin-left:0;width:100%}
  .hdr-btn{flex:1;justify-content:center}
  .gs-dropdown{position:fixed;left:12px;right:12px;top:110px;max-height:50vh}
}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:2000;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand"><b id="brandTitle"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.6" fill="currentColor" stroke="none"/></svg>Board Games Finder España</b><span id="brandSub">Bares y cafés de juegos de mesa en España</span></div>
  <nav class="view-switch" aria-label="Cambiar de mapa">
    <button class="vs-btn on" id="vsJuegos" type="button">Juegos de mesa</button>
    <button class="vs-btn" id="vsCervezas" type="button">Cervezas</button>
  </nav>
  <div class="game-search" id="gameSearchWrap">
    <input id="gameInput" type="text" placeholder="Busca un juego (p. ej. Catán, Azul, Pandemic…)" autocomplete="off">
    <button class="gs-clear" id="gsClear" aria-label="Limpiar búsqueda de juego">✕</button>
    <div class="gs-dropdown" id="gsDropdown"></div>
  </div>
  <div class="hdr-actions">
    <button class="hdr-btn" id="btnNear"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Cerca de mí</button>
    <button class="hdr-btn" id="btnShare"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>Copiar enlace</button>
  </div>
</header>
<div id="gameBanner"><span id="bannerLead">Bares donde puedes jugar a</span><span class="pill" id="bannerGame"></span><span id="bannerNote"></span><button id="bannerClear">Quitar filtro</button></div>
<main>
  <div id="map"></div>
  <aside id="sidebar">
    <div id="filters">
      <div class="f-row"><input id="nameSearch" type="text" placeholder="Buscar local por nombre o ciudad…"></div>
      <div class="f-row"><div class="f-label" id="chipsLabel">Precio para jugar</div><div class="chips" id="chipsFiltro"></div></div>
      <div class="f-grid">
        <div class="f-row"><div class="f-label">Valoración mín. <output id="outVmin">0★</output></div><input type="range" id="fVmin" min="0" max="5" step="0.5" value="0"></div>
        <div class="f-row"><div class="f-label">Reseñas mín. <output id="outRmin">0</output></div><input type="range" id="fRmin" min="0" max="1500" step="50" value="0"></div>
      </div>
      <div class="f-grid">
        <div class="f-row"><div class="f-label" id="minLabel">Nº de juegos</div>
          <select id="fNmin"><option value="0">Cualquiera</option><option value="50">50+</option><option value="200">200+</option><option value="500">500+</option><option value="1000">1000+</option></select></div>
        <div class="f-row"><div class="f-label">Ordenar por</div>
          <select id="fOrden">
            <option value="relevancia">Relevancia (valoración + reseñas)</option>
            <option value="valoracion">Valoración</option>
            <option value="resenas">Nº de reseñas</option>
            <option value="juegos">Nº de juegos</option>
            <option value="nombre">Nombre A-Z</option>
          </select></div>
      </div>
    </div>
    <div id="resultsBar"><span id="count"></span></div>
    <div id="results"></div>
  </aside>
</main>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
