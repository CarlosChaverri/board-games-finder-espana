<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Board Games Finder Madrid — Bares de juegos de mesa en Madrid</title>
<meta name="description" content="Mapa de bares y cafés de juegos de mesa en Madrid: compara valoraciones, reseñas, precios y catálogos de juegos, y encuentra dónde jugar a tu juego favorito.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#0f1420; --panel:#ffffff; --ink:#1c2434; --muted:#66708a;
  --accent:#7c5cff; --accent2:#ffb02e; --ok:#1f9d63; --warn:#c77700;
  --line:#e6e9f2; --chip:#f1f3fa; --shadow:0 8px 28px rgba(16,22,40,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;color:var(--ink)}
body{display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
/* ---------- Header ---------- */
header{background:var(--bg);color:#fff;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:1200;position:relative}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:max-content}
.brand b{font-size:16px;letter-spacing:.2px}
.brand span{font-size:11.5px;color:#9aa4c0}
.game-search{position:relative;flex:1;min-width:220px;max-width:560px}
.game-search input{width:100%;padding:9px 34px 9px 12px;border-radius:10px;border:1px solid #2a3350;background:#1a2138;color:#fff;font-size:14px;outline:none}
.game-search input::placeholder{color:#8b94b3}
.game-search input:focus{border-color:var(--accent)}
.gs-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:#8b94b3;font-size:16px;display:none}
.gs-dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;color:var(--ink);border-radius:12px;box-shadow:var(--shadow);max-height:340px;overflow:auto;display:none;z-index:1300}
.gs-item{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.gs-item:last-child{border-bottom:0}
.gs-item:hover{background:#f5f6ff}
.gs-item .nm{font-size:14px;font-weight:600}
.gs-item .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gs-family{padding:6px 12px 2px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:#fafaff;position:sticky;top:0}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;white-space:nowrap}
.badge.ok{background:#e2f6ec;color:var(--ok)}
.badge.est{background:#fdf1dc;color:var(--warn)}
.hdr-actions{display:flex;gap:8px}
.hdr-btn{background:#1a2138;color:#cfd6ec;border:1px solid #2a3350;border-radius:10px;padding:8px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.hdr-btn:hover{border-color:var(--accent);color:#fff}
/* ---------- Game banner ---------- */
#gameBanner{display:none;background:linear-gradient(90deg,#241b4d,#3b2a7a);color:#fff;padding:8px 16px;font-size:13.5px;align-items:center;gap:10px;z-index:1100;position:relative}
#gameBanner.show{display:flex}
#gameBanner .pill{background:rgba(255,255,255,.14);padding:3px 10px;border-radius:20px;font-weight:600}
#gameBanner button{margin-left:auto;background:none;border:1px solid #6f5fd0;color:#fff;border-radius:8px;padding:4px 10px;font-size:12.5px}
/* ---------- Layout ---------- */
main{flex:1;display:flex;min-height:0;position:relative}
#sidebar{width:378px;min-width:378px;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid var(--line);z-index:1000}
#map{flex:1;background:#dfe5ef}
/* ---------- Filters ---------- */
#filters{padding:12px 14px;border-bottom:1px solid var(--line);overflow-y:auto;max-height:46%}
.f-row{margin-bottom:10px}
.f-row:last-child{margin-bottom:0}
.f-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.f-label output{color:var(--accent);font-size:12px}
#nameSearch{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;outline:none}
#nameSearch:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:#3a4560;font-size:12.5px;padding:5px 10px;border-radius:20px;transition:all .15s}
.chip:hover{border-color:#c3c9e8}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=range]{width:100%;accent-color:var(--accent)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;color:var(--ink)}
/* ---------- Results ---------- */
#resultsBar{padding:9px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:#fafbfe}
#count{font-size:12.5px;color:var(--muted);font-weight:600}
#results{flex:1;overflow-y:auto}
.card{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.card:hover{background:#f6f7ff}
.card.active{background:#eef0ff;border-left:3px solid var(--accent)}
.card h3{font-size:14.5px;margin-bottom:3px;display:flex;align-items:center;gap:7px}
.card .tipo{font-size:10.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.card .sub{font-size:12px;color:var(--muted);margin-bottom:5px}
.stars{color:var(--accent2);font-weight:700;font-size:13px}
.reviews{color:var(--muted);font-weight:400;font-size:12px}
.card .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mini{font-size:10.5px;background:var(--chip);border-radius:5px;padding:2px 6px;color:#4a5470}
.score-flag{font-size:10px;color:var(--muted);font-weight:400}
/* ---------- Markers ---------- */
.pin{display:flex;align-items:center;justify-content:center;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.35);color:#fff;font-weight:800}
.pin span{transform:rotate(45deg);font-size:12px}
/* ---------- Popup ---------- */
.leaflet-popup-content-wrapper{border-radius:14px}
.leaflet-popup-content{margin:14px 16px;font-family:inherit;min-width:240px;max-width:300px}
.pop h3{font-size:16px;margin-bottom:2px}
.pop .tipo-zona{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:6px}
.pop .dir{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pop .row{display:flex;gap:6px;align-items:baseline;font-size:13px;margin-bottom:4px}
.pop .row b{min-width:86px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.pop .btns{display:flex;gap:7px;margin-top:10px}
.pop .btns a{flex:1;text-align:center;text-decoration:none;font-size:12.5px;font-weight:700;padding:8px 0;border-radius:9px}
.btn-maps{background:var(--accent);color:#fff}
.btn-web{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.pop .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.nodata{color:#98a0b8;font-style:italic}
/* ---------- Legend ---------- */
#legend{position:absolute;right:392px;bottom:110px;background:rgba(255,255,255,.94);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;font-size:12px;z-index:900}
#legend .l-item{display:flex;align-items:center;gap:7px;margin:3px 0;color:#3a4560}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
/* ---------- Mobile ---------- */
#sheetHandle{display:none}
@media (max-width:900px){
  main{flex-direction:column}
  #map{position:absolute;inset:0}
  #sidebar{position:absolute;left:0;right:0;bottom:0;width:auto;min-width:0;max-height:62%;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);border-right:0;transition:max-height .25s}
  #sidebar.collapsed{max-height:118px}
  #sheetHandle{display:flex;justify-content:center;padding:8px 0 4px;cursor:grab;touch-action:none}
  #sheetHandle i{width:44px;height:5px;border-radius:3px;background:#cdd3e4;display:block}
  #filters{max-height:none}
  #legend{bottom:auto;top:12px;right:12px;padding:8px 10px}
  header{padding:8px 10px;gap:8px}
  .brand span{display:none}
}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#232a3f;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:2000;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand"><b>🎲 Board Games Finder Madrid</b><span>Bares y cafés de juegos de mesa en Madrid capital</span></div>
  <div class="game-search">
    <input id="gameInput" type="text" placeholder="Busca un juego (p. ej. Catán, Azul, Pandemic…)" autocomplete="off">
    <button class="gs-clear" id="gsClear" aria-label="Limpiar búsqueda de juego">✕</button>
    <div class="gs-dropdown" id="gsDropdown"></div>
  </div>
  <div class="hdr-actions">
    <button class="hdr-btn" id="btnNear">📍 Cerca de mí</button>
    <button class="hdr-btn" id="btnShare">🔗 Copiar enlace</button>
  </div>
</header>
<div id="gameBanner"><span>Mostrando bares donde puedes jugar a</span><span class="pill" id="bannerGame"></span><span id="bannerNote"></span><button id="bannerClear">Quitar filtro</button></div>
<main>
  <div id="map"></div>
  <div id="legend"></div>
  <aside id="sidebar">
    <div id="sheetHandle"><i></i></div>
    <div id="filters">
      <div class="f-row"><input id="nameSearch" type="text" placeholder="Buscar bar por nombre…"></div>
      <div class="f-row"><div class="f-label">Zona</div><div class="chips" id="chipsZona"></div></div>
      <div class="f-row"><div class="f-label">Tipo de local</div><div class="chips" id="chipsTipo"></div></div>
      <div class="f-row"><div class="f-label">Tipo de juegos</div><div class="chips" id="chipsJuegos"></div></div>
      <div class="f-row"><div class="f-label">Precio para jugar</div><div class="chips" id="chipsPrecio"></div></div>
      <div class="f-grid">
        <div class="f-row"><div class="f-label">Valoración mín. <output id="outVmin">0★</output></div><input type="range" id="fVmin" min="0" max="5" step="0.5" value="0"></div>
        <div class="f-row"><div class="f-label">Reseñas mín. <output id="outRmin">0</output></div><input type="range" id="fRmin" min="0" max="1500" step="50" value="0"></div>
      </div>
      <div class="f-grid">
        <div class="f-row"><div class="f-label">Nº de juegos</div>
          <select id="fJmin"><option value="0">Cualquiera</option><option value="50">50+</option><option value="200">200+</option><option value="500">500+</option><option value="1000">1000+</option></select></div>
        <div class="f-row"><div class="f-label">Ordenar por</div>
          <select id="fOrden">
            <option value="relevancia">Relevancia (valoración + reseñas)</option>
            <option value="valoracion">Valoración</option>
            <option value="resenas">Nº de reseñas</option>
            <option value="juegos">Nº de juegos</option>
            <option value="nombre">Nombre A-Z</option>
          </select></div>
      </div>
    </div>
    <div id="resultsBar"><span id="count"></span></div>
    <div id="results"></div>
  </aside>
</main>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
